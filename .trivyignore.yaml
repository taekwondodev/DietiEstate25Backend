secrets:
  # JWT secret and SMTP password are test-only values committed intentionally.
  # They are never used in production — production secrets are injected via environment variables.
  - id: generic-api-key
    paths:
      - backend/src/test/resources/application-test.properties
    statement: "Test-only credentials (JWT secret, SMTP password) — production secrets are env-var injected"

  # PostgreSQL credentials in the integration test environments are fixed test values
  # used exclusively by ephemeral test environments, never in production.
  - id: generic-api-key
    paths:
      - k8s/test/postgres-test-deployment.yaml
    statement: "Test-only PostgreSQL credentials for ephemeral integration test environments"
