name: SAST/DAST

on:
  workflow_run:
    workflows: [Test]
    types: [completed]

jobs:
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Download JaCoCo report
        uses: actions/download-artifact@v8
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube analysis
        working-directory: backend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B compile org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar -DskipTests -Dsonar.projectKey=taekwondodev_DietiEstate25Backend -Dsonar.host.url=https://sonarcloud.io

  dast:
    name: DAST
    needs: sonar
    uses: ./.github/workflows/zap.yml
    secrets: inherit
    permissions:
      issues: write
      contents: read

  check-trivy:
    name: Gate on Trivy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Wait for Trivy to complete
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ github.event.workflow_run.head_sha }}';
            const maxAttempts = 20;
            const delayMs = 30000;
            for (let i = 0; i < maxAttempts; i++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 50
              });
              const trivy = data.workflow_runs.find(r => r.name === 'Trivy Security Scan');
              if (trivy) {
                if (trivy.conclusion === 'success') return;
                if (trivy.conclusion !== null) core.setFailed(`Trivy concluded: ${trivy.conclusion}`);
              }
              if (i < maxAttempts - 1) await new Promise(r => setTimeout(r, delayMs));
            }
            core.setFailed('Trivy did not complete within timeout (10 min)');

  deploy:
    name: Push to Docker Hub
    needs: [dast, check-trivy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-deploy-${{ hashFiles('backend/pom.xml', 'backend/Dockerfile') }}
          restore-keys: ${{ runner.os }}-buildx-deploy-

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          docker buildx build \
            --pull \
            --build-arg BUILD_WEEK=$(date +%Y-%U) \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --push \
            -t taekwondodev/dietiestate25-backend:latest \
            -t taekwondodev/dietiestate25-backend:${{ github.event.workflow_run.head_sha }} \
            -f backend/Dockerfile backend/
          rm -rf /tmp/.buildx-cache && mv /tmp/.buildx-cache-new /tmp/.buildx-cache
