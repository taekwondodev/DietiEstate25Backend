name: Snyk SCA

on:
  workflow_call:

jobs:
  snyk-oss:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Resolve Maven dependencies
        run: mvn -f backend/pom.xml dependency:resolve -q

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk dependency scan
        run: snyk test --file=backend/pom.xml --severity-threshold=high --fail-on=upgradable
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  snyk-license:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Resolve Maven dependencies
        run: mvn -f backend/pom.xml dependency:resolve -q

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk license check
        run: snyk test --file=backend/pom.xml --print-deps --policy-path=.snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
