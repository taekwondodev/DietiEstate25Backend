name: Snyk SCA

on:
  workflow_call:

jobs:
  snyk-oss:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk dependency scan
        working-directory: backend
        run: snyk test --severity-threshold=high --fail-on=upgradable --sarif-file-output=snyk-oss.sarif
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/snyk-oss.sarif
          category: snyk-oss

      - name: Fail on upgradable vulnerabilities
        working-directory: backend
        run: snyk test --severity-threshold=high --fail-on=upgradable
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  snyk-license:
    name: License Compliance
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk license check
        working-directory: backend
        run: snyk test --print-deps --policy-path=../.snyk --sarif-file-output=snyk-license.sarif
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/snyk-license.sarif
          category: snyk-license
