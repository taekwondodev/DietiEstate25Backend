name: Test

on:
  push:
    branches:
      - security
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('backend/pom.xml', 'backend/Dockerfile.test') }}
          restore-keys: ${{ runner.os }}-buildx-

      - name: Build test image
        run: |
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load -t backend-test:latest \
            -f backend/Dockerfile.test backend/
          rm -rf /tmp/.buildx-cache && mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Create network and start PostgreSQL
        run: |
          docker network create test-net
          docker run -d \
            --name my-postgres-test \
            --network test-net \
            -e POSTGRES_USER=test \
            -e POSTGRES_PASSWORD=test \
            -e POSTGRES_DB=test_db \
            -v ${{ github.workspace }}/db-init:/docker-entrypoint-initdb.d \
            --health-cmd "pg_isready -U test -d test_db" \
            --health-interval 10s \
            --health-timeout 5s \
            --health-retries 5 \
            postgres:16

      - name: Wait for PostgreSQL healthy
        run: |
          timeout 60 sh -c \
            'until [ "$(docker inspect --format={{.State.Health.Status}} my-postgres-test)" = "healthy" ]; do sleep 2; done'

      - name: Run tests
        run: |
          docker run --name backend-test \
            --network test-net \
            -e SPRING_PROFILES_ACTIVE=test \
            backend-test:latest 2>&1 | \
            grep --line-buffered -E "ERROR|FAILED|Caused by|Tests run:|BUILD SUCCESS|BUILD FAILURE|Started" || true
          exit $(docker inspect --format='{{.State.ExitCode}}' backend-test)

      - name: Extract JaCoCo report
        if: always()
        run: |
          mkdir -p backend/target/site/jacoco
          docker cp backend-test:/app/target/site/jacoco/jacoco.xml backend/target/site/jacoco/jacoco.xml

      - name: Cleanup
        if: always()
        run: |
          docker rm -f backend-test my-postgres-test || true
          docker network rm test-net || true

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/jacoco.xml
          retention-days: 1