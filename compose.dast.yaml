services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d

  backend:
    image: dietiestate25-backend:dast
    ports:
      - "8080:8080"
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test
